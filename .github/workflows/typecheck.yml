name: Checks

on:
  push:
    branches:
      - main
      - claude/session-irzd1k

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run check-data
